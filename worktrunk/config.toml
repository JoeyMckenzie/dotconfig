worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

# Bootstrap the givebutter monorepo's personal nix/devenv setup into each new
# worktree. The bundle is version-controlled in the churnix repo and excluded
# from the monorepo's git via .git/info/exclude, so it never lands in a PR.
# As a user hook it runs before any per-repo .config/wt.toml hooks, which is
# what lets it materialize that wt.toml (and run direnv) on a fresh worktree.
# Guarded by path so it only fires for givebutter-monorepo worktrees. rsync
# overlays the bundle (no --delete) so it never touches the git checkout.
[post-start]
nix-bootstrap = """
case "{{ worktree_path }}" in
  */givebutter-monorepo/*)
    rsync -a --exclude='.devenv/' --exclude='.direnv/' \
      "$HOME/code/github.com/givebutter/churnix/monorepo/" \
      "{{ worktree_path }}/"
    ( cd "{{ worktree_path }}" && direnv allow )
    ;;
esac
"""

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

template = """
Write a commit message for the staged changes below.

<format>
- Commit message MUST have a co-author trailer of "Co-Authored-By: Claude Haiku 4.6 <noreply@anthropic.com>" 
- Subject line MUST use a conventional commit prefix: feat, fix, refactor, chore, docs, test, style, perf, ci, build
- Subject line format: `type(scope): description` or `type: description`
- Subject line under 50 chars, lowercase, no period
- Add a blank line then a body paragraph describing what changed and why
- Body lines wrap at 72 chars
- Output only the commit message, no quotes or code blocks
</format>

<style>
- Imperative mood: "add feature" not "added feature"
- Scope is optional but encouraged when the change is localized (e.g. auth, api, ui)
- The body should explain context a reviewer would find useful, not just restate the diff
</style>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

<context>
Branch: {{ branch }}
{% if recent_commits %}<recent_commits>
{% for commit in recent_commits %}- {{ commit }}
{% endfor %}</recent_commits>{% endif %}
</context>
"""

squash-template = """
Combine these commits into a single commit message.

<format>
- Subject line MUST use a conventional commit prefix: feat, fix, refactor, chore, docs, test, style, perf, ci, build
- Subject line format: `type(scope): description` or `type: description`
- Subject line under 50 chars, lowercase, no period
- Add a blank line then a body paragraph summarizing the overall change and why it was made
- Body lines wrap at 72 chars
- Output only the commit message, no quotes or code blocks
</format>

<commits branch="{{ branch }}" target="{{ target_branch }}">
{% for commit in commits %}- {{ commit }}
{% endfor %}</commits>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>
"""

[list]
summary = true
