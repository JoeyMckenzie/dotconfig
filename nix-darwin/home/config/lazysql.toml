# Template seeded into ~/.config/lazysql/config.toml on first build only.
# Database connections are added through the lazysql TUI and persist locally;
# they are intentionally not stored in nix because they're machine-specific
# and may contain sensitive connection strings.
ConfigFile = '/Users/jmckenzie/.config/lazysql/config.toml'

[application]
DefaultPageSize = 300
DisableSidebar = false
SidebarOverlay = false
MaxQueryHistoryPerConnection = 100
TreeWidth = 30
JSONViewerWordWrap = false
